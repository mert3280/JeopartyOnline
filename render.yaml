services:
  - type: web
    name: jeoparty-online
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: QUESTION_STORAGE
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: jeoparty
      - key: TRUST_PROXY
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.7
