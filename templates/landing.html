<!doctype html>
<html lang="en" data-theme="sunrise">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JeoParty Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="centered">
  <div class="shape-bg" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <main class="card landing">
    <h1 class="title">JeoParty <span class="accent">Online</span></h1>
    <p class="subtitle">Host from your laptop, play from your phones.</p>

    <a class="btn btn-primary btn-large" href="{{ url_for('create_page') }}">Create Game</a>

    <div class="divider"><span>or</span></div>

    <form action="{{ url_for('join_page') }}" method="get" class="join-form">
      <label for="code-input" class="label">Have a code?</label>
      <input id="code-input" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}"
             maxlength="6" placeholder="6-digit code" class="input code-input" required>
      <button type="submit" class="btn btn-secondary btn-large" style="margin-top: 12px;">Join Game</button>
    </form>
  </main>
</body>
</html>
