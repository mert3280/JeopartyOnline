<!doctype html>
<html lang="en" data-theme="sunrise">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Game · JeoParty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="centered">
  <div class="shape-bg" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <main class="card create">
    <h1 class="title">Create <span class="accent">Game</span></h1>

    <form id="create-form" class="stack">
      <div class="field">
        <label class="label">Theme</label>
        <div id="theme-picker" class="theme-picker">
          <button type="button" class="theme-swatch" data-theme-value="sunrise">
            <div class="theme-swatch-preview"></div>
            Sunrise
          </button>
          <button type="button" class="theme-swatch" data-theme-value="kahoot">
            <div class="theme-swatch-preview"></div>
            Kahoot
          </button>
          <button type="button" class="theme-swatch" data-theme-value="neon">
            <div class="theme-swatch-preview"></div>
            Neon
          </button>
        </div>
        <div class="hint">Pick the look — players will see this too.</div>
      </div>

      <div class="field">
        <label for="set-select" class="label">Question set</label>
        <select id="set-select" name="question_set" class="input" required></select>
        <div class="hint" id="set-hint"></div>
      </div>

      <div class="field">
        <label class="label">Teams</label>
        <div id="team-list" class="team-list"></div>
        <div class="row">
          <input id="team-input" type="text" class="input" placeholder="Team name" maxlength="30">
          <button type="button" id="add-team-btn" class="btn btn-secondary">Add</button>
        </div>
      </div>

      <div class="field">
        <label for="time-input" class="label">Question time (seconds)</label>
        <input id="time-input" name="question_time" type="number" min="1" max="120" value="5"
               class="input">
      </div>

      <div id="error" class="error" hidden></div>
      <button type="submit" class="btn btn-primary btn-large">Create Game</button>
      <a href="{{ url_for('landing') }}" class="back-link">← back</a>
    </form>
  </main>
  <script src="{{ url_for('static', filename='js/create.js') }}"></script>
</body>
</html>
