<!doctype html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Play · JeoParty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="play-body">
  <div class="shape-bg" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <main id="play-main" class="play-main">
    <!-- NAME + TEAM SELECT -->
    <section id="join-screen" class="play-section">
      <h1 class="title">Join <span class="accent">Game</span></h1>
      <p class="muted">Code <strong>{{ code }}</strong></p>
      <div class="field">
        <label for="name-input" class="label">Your name</label>
        <input id="name-input" type="text" maxlength="30" class="input" placeholder="e.g. Sam" autofocus>
      </div>
      <div class="field">
        <label class="label">Join a team</label>
        <div id="team-options" class="team-options"></div>
        <p id="no-teams" class="hint" hidden>No teams yet. Create the first one below.</p>
      </div>
      <div class="field">
        <label for="new-team-input" class="label">…or create a new team</label>
        <input id="new-team-input" type="text" maxlength="30" class="input" placeholder="New team name">
      </div>
      <div id="join-error" class="error" hidden></div>
      <button id="join-btn" class="btn btn-primary btn-large" disabled>Join</button>
    </section>

    <!-- LOBBY (waiting) -->
    <section id="play-lobby" class="play-section" hidden>
      <h1 class="title">You're <span class="accent">in!</span></h1>
      <p class="muted" id="play-lobby-info"></p>
      <div class="field">
        <label class="label">Team color</label>
        <div id="color-picker" class="color-picker"></div>
        <div class="hint">Pick any color not already taken.</div>
      </div>
      <div id="cookie-game" class="cookie-game" hidden>
        <div class="label">Cookie break</div>
        <button id="cookie-btn" type="button" class="cookie-btn" aria-label="Nibble your team's cookie">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <mask id="cookie-mask">
                <rect width="100" height="100" fill="white"/>
                <g id="cookie-bites" fill="black"></g>
              </mask>
            </defs>
            <g mask="url(#cookie-mask)">
              <circle cx="50" cy="50" r="44" fill="#d9a25f" stroke="#a8692e" stroke-width="3"/>
              <g fill="#4a2a14">
                <ellipse cx="34" cy="32" rx="5" ry="4"/>
                <ellipse cx="62" cy="28" rx="4" ry="3.5"/>
                <ellipse cx="70" cy="52" rx="5" ry="4"/>
                <ellipse cx="46" cy="50" rx="4.5" ry="4"/>
                <ellipse cx="28" cy="58" rx="4" ry="3.5"/>
                <ellipse cx="52" cy="72" rx="5" ry="4"/>
                <ellipse cx="72" cy="74" rx="3.5" ry="3"/>
              </g>
            </g>
          </svg>
        </button>
        <div id="bite-dots" class="bite-dots" aria-hidden="true"></div>
        <p id="cookie-status" class="hint"></p>
      </div>
      <div class="waiting">
        <div class="spinner"></div>
        <p>Waiting for the host to start…</p>
      </div>
      <div class="lobby-actions">
        <button id="back-btn" type="button" class="btn btn-ghost">← Back</button>
        <button id="leave-btn" type="button" class="btn btn-danger">Leave Game</button>
      </div>
    </section>

    <!-- IN-GAME (board phase + question phase) -->
    <section id="play-game" class="play-section" hidden>
      <header class="play-header">
        <span id="play-team-chip" class="chip"></span>
        <span id="play-name-chip" class="chip muted"></span>
      </header>

      <div id="play-status" class="play-status">Waiting for the host to pick a question…</div>

      <div id="play-question" class="play-question" hidden>
        <div class="play-meta">
          <span id="play-q-cat"></span> · <span id="play-q-pts"></span>
        </div>
        <div id="play-q-text" class="play-q-text"></div>
        <div id="play-q-answer" class="play-q-answer" hidden></div>
        <div id="play-buzz-status" class="buzz-status" hidden></div>
        <button id="buzz-btn" class="btn buzz-btn" hidden>BUZZ</button>
      </div>

      <div class="play-scores" id="play-scores"></div>
    </section>

    <!-- ENDED -->
    <section id="play-ended" class="play-section" hidden>
      <h1 class="title">Game <span class="accent">Over</span></h1>
      <ol id="play-standings" class="standings"></ol>
    </section>
  </main>

  <script>
    window.GAME = { code: "{{ code }}" };
  </script>
  <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/play.js') }}"></script>
</body>
</html>
