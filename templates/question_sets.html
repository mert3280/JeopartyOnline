<!doctype html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Sets · JeoParty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="centered">
  <div class="shape-bg" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <main class="card question-sets">
    <h1 class="title">Question <span class="accent">Sets</span></h1>
    <p class="subtitle">Edit, rename or delete a set with its password, or build a new one.</p>

    <a class="btn btn-primary btn-large" href="{{ url_for('new_question_set_page') }}">+ Create New Set</a>

    <div class="qs-import">
      <a class="btn btn-ghost" href="{{ url_for('question_set_template') }}" download>Download JSON Template</a>
      <label class="btn btn-secondary" for="upload-input">Upload JSON</label>
      <input id="upload-input" type="file" accept=".json,application/json" multiple hidden>
    </div>
    <div class="hint qs-import-hint">Fill in the template offline (including a password for each set), then upload it. A file can hold one set or a list of sets.</div>

    <div id="notice" class="qs-notice" hidden></div>
    <div id="error" class="error" hidden></div>
    <div id="sets-empty" class="muted qs-empty" hidden>No question sets yet.</div>
    <ul id="sets-list" class="qs-list"></ul>

    <a href="{{ url_for('landing') }}" class="back-link">← back</a>
  </main>
  <script src="{{ url_for('static', filename='js/question_sets.js') }}"></script>
</body>
</html>
